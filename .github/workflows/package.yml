
name: Build self-contained desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile game
        shell: bash
        run: |
          mkdir -p classes build dist
          javac -d classes src/NumberGuessingGameGUI.java
          jar --create \
            --file build/NumberGuessingGame.jar \
            --main-class NumberGuessingGameGUI \
            -C classes .

      - name: Create app with bundled Java runtime
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --name NumberGuessingGame \
            --input build \
            --main-jar NumberGuessingGame.jar \
            --main-class NumberGuessingGameGUI \
            --dest dist

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/NumberGuessingGame `
            -DestinationPath dist/NumberGuessingGame-Windows-x64.zip

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            NumberGuessingGame.app NumberGuessingGame-macOS.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C dist -czf dist/NumberGuessingGame-Linux-x64.tar.gz \
            NumberGuessingGame

      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: NumberGuessingGame-${{ matrix.platform }}
          path: dist/NumberGuessingGame-*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$REPO" \
            --title "Number Guessing Game $TAG" \
            --generate-notes
